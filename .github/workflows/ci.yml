# Quality gate G2: every pull request must pass all jobs before it can be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend - lint, complexity, security, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check .
      - name: McCabe complexity <= 10 per function (NFR-05)
        run: xenon --max-absolute B --max-modules B --max-average A app
      - name: Security scan, no medium or high findings (Bandit)
        run: bandit -r app -ll
      - name: Vulnerable dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Unit, integration and contract tests with coverage >= 70%
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Dogfooding - our own grade must be B or better
        run: python scripts/dogfood.py --min-grade B

  frontend:
    name: Frontend - lint, type check, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
      - name: Vulnerable dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright) and accessibility
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the app
        working-directory: backend
        run: |
          QG_MAX_ANALYSES_PER_HOUR=50 nohup uvicorn app.main:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image builds (NFR-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quality-gatekeeper:ci .
      - name: Container starts and answers health check
        run: |
          docker run -d --name qg -p 8000:8000 --read-only --cap-drop ALL \
            --tmpfs /work --tmpfs /tmp -v qgdata:/data quality-gatekeeper:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          docker logs qg; exit 1
